name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Frontend build
        run: pnpm build
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib
      - name: Lint
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  release:
    name: ${{ matrix.label }}
    needs: check
    # Only publish when a version tag is pushed.
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - label: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - label: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # tauri-action builds, signs and publishes the release in one step.
      # The signing key must be added as a repository secret named
      # TAURI_SIGNING_PRIVATE_KEY (see README).
      #
      # The release is published straight away (releaseDraft: false). It used to
      # be a draft, which needed a human to press "Publish release" by hand --
      # and that hand step is how v0.1.2 ended up published with nothing but the
      # source archives on it. Pushing the tag is now the only step.
      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Serious ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG for details."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # A run can finish green while the release itself carries nothing, which
      # is exactly what v0.1.2 did: the tag published, but only the source
      # archives were attached, so the updater endpoint 404'd and nobody could
      # download anything. This step turns that silent failure into a red run.
      - name: Verify the release carries updater artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          ok=0
          for attempt in $(seq 1 12); do
            names=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.assets[].name' 2>/dev/null)
            has_manifest=0
            case "$names" in *latest.json*) has_manifest=1 ;; esac
            sigs=$(printf '%s\n' "$names" | grep -c '\.sig$')
            echo "attempt $attempt: latest.json=$has_manifest sigs=$sigs"
            if [ "$has_manifest" = "1" ] && [ "$sigs" -gt 0 ]; then
              ok=1
              printf '%s\n' "$names"
              break
            fi
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Release $TAG is published without updater artifacts. latest.json and at least one .sig must be attached, otherwise the app cannot be installed or updated from it."
            exit 1
          fi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: serious-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.sig
            src-tauri/target/release/bundle/**/*.nsis.zip
          if-no-files-found: ignore
