[package]
name = "serious"
version = "0.1.0"
description = "Cross-platform desktop client for Legado source collections"
authors = ["Serious"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "serious_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
boa_engine = "0.20.0"
chrono = "0.4.45"
encoding_rs = "0.8.35"
env_logger = "0.11.11"
jsonpath_lib = "0.3.0"
log = "0.4.34"
once_cell = "1.21.4"
percent-encoding = "2.3.2"
rand = "0.9.5"
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls", "gzip", "brotli", "deflate", "cookies", "charset", "http2"] }
scraper = "0.27.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2.7.0"
tauri = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "zip"] }
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
url = "2.5.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
