[package]
name = "serious"
version = "0.1.4"
description = "Cross-platform desktop client for Legado source collections"
authors = ["Serious"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "serious_lib"
# `rlib` only. `staticlib`/`cdylib` are the Tauri *mobile* template defaults and
# this app ships Windows and macOS desktops, which link the rlib.
#
# They are not merely unused here. A `cdylib` is rebuilt for every integration
# test target under the same output filename, which collides with the rlib's,
# and combined with `panic = "abort"` below that made `cargo test --release`
# compile whole test targets against mismatched metadata: every target passed
# on its own and the suite failed as a whole, with type errors that did not
# exist in any single build.
crate-type = ["rlib"]

# Tauri serves the bundled frontend through a custom protocol in release
# builds. Without this feature a release binary falls back to `devUrl` and
# renders a blank window, because plain `cargo build --release` never passes it.
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
boa_engine = "0.20.0"
chrono = "0.4.45"
encoding_rs = "0.8.35"
env_logger = "0.11.11"
jsonpath_lib = "0.3.0"
log = "0.4.34"
once_cell = "1.21.4"
percent-encoding = "2.3.2"
rand = "0.9.5"
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls", "gzip", "brotli", "deflate", "cookies", "charset", "http2"] }
scraper = "0.27.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2.7.0"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "zip"] }
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
url = "2.5.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
